# ==============================================================================
# MineGuard AI — Netlify Production Deployment Configuration
# SIH 26008: Intelligent Conveyor Belt Monitoring Platform
# ==============================================================================

[build]
  # Build the production React + TypeScript + Vite dashboard
  base = "mineguard-dashboard"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA Fallback routing for single-page application
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security, camera permission, and modern caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=*, microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
